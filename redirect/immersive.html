<meta name="robots" content="noindex">
<script>
  // InfoPlay est désormais à la racine du site : on garde la page demandée et l'écran (#/…).
  // Même domaine : la progression enregistrée dans ce navigateur est conservée.
  var page = location.pathname.replace(/^\/infoplay-maroc\/?/, '').replace(/^index\.html$/, '');
  location.replace('/' + page + location.search + location.hash);
</script>
