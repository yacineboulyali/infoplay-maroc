  <script>
    (()=>{
      const root=document.getElementById('m205-image-comparison');
      const payload=JSON.parse(root.querySelector('#m205-review-data').textContent);
      const cases=payload.cases;
      const select=root.querySelector('#review-case');
      const saved=window.openai?.widgetState;
      let index=cases.findIndex(c=>c.id==='18');
      let decisions={};
      if(saved?.modelContent?.review==='m205-images-v1')decisions=saved.modelContent.decisions||{};
      const oldImage=root.querySelector('#old-image');
      const newImage=root.querySelector('#new-image');
      cases.forEach(c=>{const option=document.createElement('option');option.value=c.id;option.textContent=c.id+' · '+c.label;select.append(option)});
      function save(){window.openai?.setWidgetState?.({modelContent:{review:'m205-images-v1',decisions},privateContent:{index}})?.catch(()=>{});}
      function render(){
        const c=cases[index];if(!c)return;
        select.value=c.id;
        root.querySelector('#review-count').textContent=(index+1)+' / '+cases.length;
        root.querySelector('#review-activity').textContent=c.activity+' · '+c.title;
        root.querySelector('#review-question').textContent=c.question;
        root.querySelector('#review-label').textContent=c.label;
        root.querySelector('#review-reason').textContent=c.reason;
        oldImage.src=payload.images[c.oldImage];oldImage.alt='الصورة القديمة المرتبطة بـ '+c.label;
        newImage.src=payload.images[c.newImage];newImage.alt='البديل التعليمي المقترح لـ '+c.label;
        root.querySelector('#review-previous').disabled=index===0;
        root.querySelector('#review-next').disabled=index===cases.length-1;
        root.querySelectorAll('input[name="m205-review-decision"]').forEach(input=>input.checked=input.value===(decisions[c.id]||'pending'));
        const accepted=Object.values(decisions).filter(x=>x==='accept').length;
        const revised=Object.values(decisions).filter(x=>x==='revise').length;
        root.querySelector('#review-state').textContent='مناسب: '+accepted+' · يحتاج تعديلًا: '+revised+' · لم تُدمج البدائل بعد';
      }
      select.addEventListener('change',()=>{index=cases.findIndex(c=>c.id===select.value);render();save()});
      root.querySelector('#review-previous').addEventListener('click',()=>{if(index>0){index--;render();save()}});
      root.querySelector('#review-next').addEventListener('click',()=>{if(index<cases.length-1){index++;render();save()}});
      root.querySelectorAll('input[name="m205-review-decision"]').forEach(input=>input.addEventListener('change',()=>{decisions[cases[index].id]=input.value;render();save()}));
      root.querySelector('#send-review').addEventListener('click',async()=>{
        const accepted=cases.filter(c=>decisions[c.id]==='accept');
        const revise=cases.filter(c=>decisions[c.id]==='revise');
        if(!accepted.length&&!revise.length){root.querySelector('#review-state').textContent='اختر حالة واحدة على الأقل للمراجعة.';return;}
        const prompt='مراجعة بدائل صور M205: أوافق على إدماج الحالات التالية فقط: '+(accepted.map(c=>c.id+' ('+c.label+')').join('، ')||'لا شيء')+'. الحالات التي تحتاج تعديلًا قبل الإدماج: '+(revise.map(c=>c.id+' ('+c.label+')').join('، ')||'لا شيء')+'. استخدم manifest.json في output/m205-image-review لتحديد النشاط والنص بدقة. لا تعتبر الحالات غير المحددة موافقة.';
        if(window.openai?.sendFollowUpMessage)await window.openai.sendFollowUpMessage({prompt,title:'إرسال قرارات مراجعة صور M205'});
        else root.querySelector('#review-state').textContent=prompt;
      });
      window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState;if(state?.modelContent?.review==='m205-images-v1'){decisions=state.modelContent.decisions||{};render()}});
      render();
    })();
  </script>
