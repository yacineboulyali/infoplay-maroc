name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # InfoPlay est publié à la racine https://yacineboulyali.github.io/ (npm run publish:root) :
      # /infoplay-maroc/ ne sert plus qu'une redirection qui conserve la page et l'écran demandés.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
